# Curated MCP Server Registry
# Referenced by /crew setup-mcp command — edit this file to add/update MCP servers
# Last verified: 2026-03-12 (Jira/Confluence, Notion, Linear, GitHub). Google Drive, Slack and Trello entries
# were removed on 2026-11-22 because their package names / URLs could not be verified.

registry:
  jira:
    name: "Jira (Atlassian Rovo)"
    transport: http
    url: "https://mcp.atlassian.com/v1/mcp"
    auth: oauth
    purpose: "Fetch epics, stories, sprint data, and manage Jira issues"
    notes: "Official Atlassian Rovo MCP. Covers Jira + Confluence in one server. OAuth via browser."
    onboarding_only: true

  confluence:
    name: "Confluence (Atlassian Rovo)"
    transport: http
    url: "https://mcp.atlassian.com/v1/mcp"
    auth: oauth
    purpose: "Fetch and manage Confluence pages and spaces"
    notes: "Same Atlassian Rovo MCP as Jira. If Jira is already configured, Confluence is available too."
    shared_with: "jira"
    onboarding_only: true

  notion:
    name: "Notion"
    transport: http
    url: "https://mcp.notion.com/mcp"
    auth: oauth
    purpose: "Fetch pages and databases by link"
    onboarding_only: true

  linear:
    name: "Linear"
    transport: http
    url: "https://mcp.linear.app/sse"
    auth: oauth
    purpose: "Fetch issues, projects, and cycles by link"
    onboarding_only: true

  github:
    name: "GitHub"
    transport: http
    url: "https://api.githubcopilot.com/mcp/"
    auth: oauth
    purpose: "Fetch issues, PRs, project boards"
    onboarding_only: false

  superdesign:
    name: "SuperDesign (optional)"
    transport: stdio
    manual: true          # no install command here: Crew does not ship or pin it
    purpose: "Generate high-fidelity UI screens from styled-dsl.yaml (Phase 2.25)"
    notes: >
      Optional. If you use a SuperDesign MCP server, install it from its own documentation and pin a version.
      Crew works without it: Phase 2.25 is skipped (Phase 2 -> 2.5).
    onboarding_only: false
    phase: "2.25"
